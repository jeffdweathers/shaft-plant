<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Shaft</title>
<style>
  :root { --ink:#f4efe6; --muted:#9a9286; --plasma:#3ee0ff; --good:#7dffa8; --copper:#e0a15c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#07090d; color:var(--ink); font-family:sans-serif; }
  body { background:#07090d; }
  .app { width:min(430px,100vw); height:100dvh; margin:0 auto; display:flex; flex-direction:column; padding:8px 12px 10px; gap:6px; }
  h1 { margin:0; letter-spacing:.18em; font-size:20px; } h1 i { font-style:normal; color:#3ee0ff; }
  .sub { color:#9a9286; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .top { display:flex; justify-content:space-between; align-items:flex-end; }
  .kw b { font-size:28px; } .kw span, .pill span { color:#9a9286; font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
  .pills { display:flex; gap:6px; } .pill { border:1px solid rgba(224,161,92,.28); border-radius:10px; padding:4px 7px; min-width:58px; } .pill b { display:block; }
  .goal { color:#7dffa8; font-size:13px; } .coach { border:1px solid rgba(62,224,255,.55); border-radius:12px; padding:8px 10px; } .coach b { color:#3ee0ff; font-size:11px; letter-spacing:.08em; text-transform:uppercase; } .coach p { margin:3px 0 0; font-size:14px; }
  button { background:#121820; color:#f4efe6; border:1px solid rgba(154,146,134,.4); border-radius:10px; padding:8px 10px; font:inherit; } #next,#show { background:#7dffa8; color:#04210f; border:0; font-weight:700; }
  .stage { flex:1; min-height:0; display:flex; align-items:center; } .frame { width:100%; border:1px solid rgba(154,146,134,.28); border-radius:18px; padding:6px; position:relative; } .frame.live { border-color:#7dffa8; box-shadow:0 0 18px rgba(62,224,255,.3); }
  .viewport { width:100%; aspect-ratio:1; overflow:hidden; border-radius:12px; position:relative; touch-action:none; background:#0c1218; }
  #world { position:absolute; left:0; top:0; display:grid; gap:2px; transition:transform 1.15s cubic-bezier(.2,.7,.2,1); }
  #flow { position:absolute; left:0; top:0; pointer-events:none; z-index:3; }
  .cell { border-radius:4px; background:#1a212b; position:relative; } .cell.yard { background:#10161e; box-shadow:inset 0 0 0 1px rgba(62,224,255,.12); }
  .cell.path { background:linear-gradient(180deg,#d39255,#6a3f22); } .cell.machine { background:radial-gradient(circle at 50% 42%,#b9ecff,#1b4a58 64%); } .cell.source { background:radial-gradient(circle at 50% 42%,#ffe3a6,#d36a14 58%,#2a2118 74%); } .cell.xfmr { background:radial-gradient(circle at 50% 50%,#d7c8ff,#2a3158 70%); }
  .cell.load { background:radial-gradient(circle at 50% 50%,#b6ffcf,#1d6b3a 70%); } .cell.load::after { content:"town"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:#04210f; font-weight:700; }
  .cell.town { background:#2f7a49; } .cell.town::after { content:"fed"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#04210f; }
  .cell.powered { box-shadow:inset 0 0 0 2px rgba(180,245,255,.9); animation:pulse 1.2s ease-in-out infinite; } .cell.fed { box-shadow:0 0 16px #7dffa8, inset 0 0 0 2px #7dffa8; } .cell.ghost { outline:2px solid #3ee0ff; } .cell.bad { outline:2px solid #ff5d4a; }
  @keyframes pulse { 50% { filter:brightness(1.35); } }
  .bang { position:absolute; inset:6px; display:flex; align-items:center; justify-content:center; background:rgba(3,16,14,.94); z-index:6; border-radius:12px; }
  .bang div { text-align:center; background:#071612; border:2px solid #7dffa8; border-radius:16px; padding:16px 18px; animation:pop .45s ease; } .bang b { display:block; font-size:22px; color:#b6ffcf; } .bang span { font-size:15px; }
  @keyframes pop { from { transform:scale(.55); opacity:0; } to { transform:scale(1); opacity:1; } } .hidden { display:none !important; }
  .tray { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .slot { min-height:68px; border-radius:12px; border:1px solid rgba(154,146,134,.25); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; touch-action:none; } .slot em { font-style:normal; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#9a9286; }
  .piece { display:grid; gap:2px; } .pip { border-radius:3px; } .pip.source { background:#e0a15c; } .pip.path { background:#d39255; } .pip.machine { background:#7fd7ee; } .pip.xfmr { background:#c3b0ff; }
  .float { position:fixed; z-index:8; pointer-events:none; } .bar { display:flex; gap:8px; } .bar button { flex:1; }
</style></head>
<body><div class="app">
  <div class="top"><div><h1>SHA<i>F</i>T</h1><div class="sub">v14 · plant pulls back</div></div><div class="kw"><b id="kw">0</b><span>kilowatts</span></div></div>
  <div class="pills"><div class="pill"><b id="mod">1</b><span>module</span></div><div class="pill"><b id="view">8×8</b><span>view</span></div><div class="pill"><b id="best">0</b><span>best</span></div></div>
  <div class="coach" id="coach"><b id="step">step 1 of 4</b><p id="lesson"></p><div class="bar"><button id="next">next</button><button id="hide">hide</button></div></div>
  <div class="goal" id="goal">Module 1: run power into the green town.</div>
  <div class="stage"><div class="frame" id="frame"><div class="viewport" id="viewport"><div id="world"></div></div><div class="bang hidden" id="bang"><div><b id="bangTitle">MODULE 1 COMPLETE</b><span id="bangSub">Plant shrinking</span></div></div></div></div>
  <div class="tray" id="tray"></div><div class="bar"><button id="reset">reset</button><button id="show" class="hidden">lessons</button></div>
</div><div class="float hidden" id="float"></div>
<script>
const N=24,BASE=8,VIEWS=[8,12,16,24],GAP=2,KEY="shaft-lessons-v14";
const NAMES={source:"core",path:"bus",machine:"turbine",xfmr:"transformer"};
const LESSONS=["Drag the gold core onto the pad. It is the only source. A core with no path out scores 0.","Run copper bus from the core toward the green town. Current only travels on connected pieces.","A turbine or transformer on that live path multiplies kilowatts. Off the path, it does nothing.","Touch the green town with a powered piece. MODULE COMPLETE flashes, then the whole plant shrinks and a new town opens farther out."];
const CATALOG=[{kind:"source",shape:[[1,1],[1,1]]},{kind:"source",shape:[[1,1,1],[0,1,0]]},{kind:"path",shape:[[1,1,1,1]]},{kind:"path",shape:[[1],[1],[1],[1]]},{kind:"path",shape:[[1,1,1],[0,0,1]]},{kind:"path",shape:[[1,0],[1,0],[1,1]]},{kind:"path",shape:[[0,1],[0,1],[1,1]]},{kind:"path",shape:[[1,1,0],[0,1,1]]},{kind:"machine",shape:[[1,1],[1,1]]},{kind:"machine",shape:[[1,1,1],[0,1,0]]},{kind:"xfmr",shape:[[1,1,1]]}];
const worldEl=document.getElementById("world"),viewport=document.getElementById("viewport"),frameEl=document.getElementById("frame"),trayEl=document.getElementById("tray"),floatEl=document.getElementById("float"),coach=document.getElementById("coach"),bang=document.getElementById("bang"),flow=document.createElement("canvas");
flow.id="flow"; let grid,tray,drag,view,best,cells=[],load,busy,step,lessonsOn,cellPx=36,flowT=0,last=null;
const empty=()=>Array.from({length:N},()=>Array(N).fill(null));
const windowOrigin=()=>Math.floor((N-VIEWS[view])/2);
const inView=(r,c)=>{const o=windowOrigin(),s=VIEWS[view];return r>=o&&c>=o&&r<o+s&&c<o+s;};
function placeLoad(){const o=windowOrigin(),s=VIEWS[view];let r=o+s-2,c=o+s-2;if(grid[r][c]){r=o+1;c=o+s-2;}load={r,c};}
function stampTown(){if(!load||grid[load.r][load.c])return;grid[load.r][load.c]={kind:"town"};}
function anchorOf(shape){const h=shape.length,w=shape[0].length;let bestA=[0,0],bd=1e9;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(shape[y][x]){const d=(y-(h-1)/2)**2+(x-(w-1)/2)**2;if(d<bd){bd=d;bestA=[y,x];}}return bestA;}
function pick(force){const pool=force?CATALOG.filter(p=>p.kind==="source"):CATALOG;const src=pool[Math.floor(Math.random()*pool.length)];return {kind:src.kind,shape:src.shape.map(r=>r.slice()),used:false};}
function freshTray(){const has=grid.flat().some(c=>c&&c.kind==="source");tray=has?[pick(false),pick(false),pick(false)]:[{kind:"source",shape:[[1,1],[1,1]],used:false},{kind:"path",shape:[[1,1,1,1]],used:false},{kind:"path",shape:[[1],[1],[1],[1]],used:false}];}
function fits(shape,r,c){for(let y=0;y<shape.length;y++)for(let x=0;x<shape[y].length;x++){if(!shape[y][x])continue;const nr=r+y,nc=c+x;if(nr<0||nc<0||nr>=N||nc>=N||grid[nr][nc]||!inView(nr,nc)||(load&&nr===load.r&&nc===load.c))return false;}return true;}
function analyze(){const powered=empty().map(row=>row.map(()=>false));const q=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]&&grid[r][c].kind==="source")q.push([r,c]);const seen=new Set(q.map(([r,c])=>r+","+c));let feed=false,n=0,machines=0;while(q.length){const [r,c]=q.shift();powered[r][c]=true;if(load&&Math.abs(r-load.r)+Math.abs(c-load.c)===1)feed=true;for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc,k=nr+","+nc;if(nr<0||nc<0||nr>=N||nc>=N||seen.has(k)||!grid[nr][nc])continue;seen.add(k);q.push([nr,nc]);}}for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!powered[r][c])continue;n++;if(grid[r][c].kind==="machine"||grid[r][c].kind==="xfmr")machines++;}return {powered,feed,kw:n*25+machines*110+(feed?150+view*200:0)};}
function layout(){const S=viewport.clientWidth||300;cellPx=(S-GAP*(BASE-1))/BASE;const worldPx=N*cellPx+GAP*(N-1);worldEl.style.width=worldPx+"px";worldEl.style.height=worldPx+"px";worldEl.style.gridTemplateColumns=`repeat(${N}, ${cellPx}px)`;worldEl.style.gridTemplateRows=`repeat(${N}, ${cellPx}px)`;const o=windowOrigin(),v=VIEWS[view],win=v*cellPx+GAP*(v-1),winCenter=o*(cellPx+GAP)+win/2,scale=BASE/v;worldEl.style.transformOrigin=winCenter+"px "+winCenter+"px";worldEl.style.transform=`translate(${S/2-winCenter}px, ${S/2-winCenter}px) scale(${scale})`;flow.width=Math.round(worldPx);flow.height=Math.round(worldPx);flow.style.width=worldPx+"px";flow.style.height=worldPx+"px";}
function paint(){const a=analyze();last=a;cells.forEach((el,i)=>{const r=Math.floor(i/N),c=i%N,cell=grid[r][c],isLoad=load&&r===load.r&&c===load.c;el.className="cell"+(inView(r,c)?"":" yard")+(isLoad?" load":"")+(cell?" "+cell.kind:"")+(cell&&a.powered[r][c]?" powered":"")+(isLoad&&a.feed?" fed":"");});document.getElementById("kw").textContent=a.kw;document.getElementById("mod").textContent=Math.min(view+1,VIEWS.length);document.getElementById("view").textContent=VIEWS[view]+"\u00d7"+VIEWS[view];document.getElementById("best").textContent=best;frameEl.classList.toggle("live",!!a.feed);document.getElementById("goal").textContent=view>=VIEWS.length-1&&a.feed?"Plant complete. This is the whole yard.":"Module "+(view+1)+": run power into the green town.";if(a.kw>best){best=a.kw;localStorage.setItem("shaft-best14",String(best));document.getElementById("best").textContent=best;}return a;}
function pieceHTML(p,size){const h=p.shape.length,w=p.shape[0].length;return `<div class="piece" style="grid-template-columns:repeat(${w},${size}px);grid-template-rows:repeat(${h},${size}px)">${p.shape.flat().map(v=>v?`<div class="pip ${p.kind}"></div>`:"<div></div>").join("")}</div>`;}
function renderTray(){trayEl.innerHTML=tray.map((p,i)=>`<div class="slot" data-i="${i}">${p&&!p.used?pieceHTML(p,14)+`<em>${NAMES[p.kind]}</em>`:""}</div>`).join("");bindTray();}
function showLesson(){if(!lessonsOn){coach.classList.add("hidden");document.getElementById("show").classList.remove("hidden");return;}coach.classList.remove("hidden");document.getElementById("show").classList.add("hidden");document.getElementById("step").textContent="step "+(Math.min(step,LESSONS.length-1)+1)+" of "+LESSONS.length;document.getElementById("lesson").textContent=LESSONS[Math.min(step,LESSONS.length-1)];document.getElementById("next").textContent=step>=LESSONS.length-1?"done":"next";}
function celebrate(){busy=true;document.getElementById("bangTitle").textContent="MODULE "+(view+1)+" COMPLETE";document.getElementById("bangSub").textContent=view>=VIEWS.length-1?"The yard is open":"Plant shrinking";bang.classList.remove("hidden");setTimeout(()=>{stampTown();if(view<VIEWS.length-1)view++;placeLoad();layout();paint();setTimeout(()=>{bang.classList.add("hidden");busy=false;},1600);},700);}
function place(p,r,c){const before=analyze().feed;for(let y=0;y<p.shape.length;y++)for(let x=0;x<p.shape[y].length;x++)if(p.shape[y][x])grid[r+y][c+x]={kind:p.kind};p.used=true;if(tray.every(t=>t.used))freshTray();const a=paint();renderTray();if(!before&&a.feed)celebrate();else if(step===0&&p.kind==="source"){step=1;showLesson();}else if(step===1&&p.kind==="path"){step=2;showLesson();}}
function cellAt(x,y){return cells.find(el=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;});}
function hover(x,y,p){cells.forEach(el=>el.classList.remove("ghost","bad"));const hit=cellAt(x,y);if(!hit)return null;const i=Number(hit.dataset.i),[ay,ax]=anchorOf(p.shape),r=Math.floor(i/N)-ay,c=(i%N)-ax,ok=fits(p.shape,r,c);for(let yy=0;yy<p.shape.length;yy++)for(let xx=0;xx<p.shape[yy].length;xx++){if(!p.shape[yy][xx])continue;const nr=r+yy,nc=c+xx;if(nr<0||nc<0||nr>=N||nc>=N)continue;cells[nr*N+nc].classList.add(ok?"ghost":"bad");}return ok?{r,c}:null;}
function placeFloat(p,x,y){const [ay,ax]=anchorOf(p.shape),size=20,gap=2;floatEl.style.left=(x-ax*(size+gap)-size/2)+"px";floatEl.style.top=(y-ay*(size+gap)-size/2)+"px";}
function bindTray(){trayEl.querySelectorAll(".slot").forEach(slot=>{slot.onpointerdown=e=>{const p=tray[Number(slot.dataset.i)];if(!p||p.used||busy)return;e.preventDefault();slot.setPointerCapture(e.pointerId);drag={p,pid:e.pointerId};floatEl.classList.remove("hidden");floatEl.innerHTML=pieceHTML(p,20);placeFloat(p,e.clientX,e.clientY);};slot.onpointermove=e=>{if(!drag||drag.pid!==e.pointerId)return;placeFloat(drag.p,e.clientX,e.clientY);hover(e.clientX,e.clientY,drag.p);};slot.onpointerup=e=>{if(!drag||drag.pid!==e.pointerId)return;const spot=hover(e.clientX,e.clientY,drag.p);floatEl.classList.add("hidden");cells.forEach(el=>el.classList.remove("ghost","bad"));const p=drag.p;drag=null;if(spot)place(p,spot.r,spot.c);};slot.onpointercancel=()=>{drag=null;floatEl.classList.add("hidden");cells.forEach(el=>el.classList.remove("ghost","bad"));};});}
function drawFlow(){const ctx=flow.getContext("2d"),w=flow.width;ctx.clearRect(0,0,w,w);if(last){ctx.lineWidth=Math.max(2,cellPx*0.16);ctx.strokeStyle="rgba(62,224,255,.9)";ctx.shadowColor="#3ee0ff";ctx.shadowBlur=8;ctx.setLineDash([cellPx*0.28,cellPx*0.34]);ctx.lineDashOffset=-flowT;ctx.lineCap="round";ctx.beginPath();const step=cellPx+GAP;for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!last.powered[r][c])continue;const x=c*step+cellPx/2,y=r*step+cellPx/2;if(c+1<N&&last.powered[r][c+1]){ctx.moveTo(x,y);ctx.lineTo(x+step,y);}if(r+1<N&&last.powered[r+1][c]){ctx.moveTo(x,y);ctx.lineTo(x,y+step);}}ctx.stroke();}flowT=(flowT+0.85)%(cellPx*2);requestAnimationFrame(drawFlow);}
function boot(){grid=empty();view=0;busy=false;step=0;lessonsOn=localStorage.getItem(KEY)!=="off";placeLoad();worldEl.innerHTML="";worldEl.appendChild(flow);grid.flat().forEach((_,i)=>{const el=document.createElement("div");el.className="cell";el.dataset.i=i;worldEl.appendChild(el);});cells=[...worldEl.querySelectorAll(".cell")];freshTray();bang.classList.add("hidden");showLesson();layout();paint();renderTray();}
document.getElementById("reset").onclick=boot;document.getElementById("show").onclick=()=>{lessonsOn=true;localStorage.removeItem(KEY);showLesson();};document.getElementById("hide").onclick=()=>{lessonsOn=false;localStorage.setItem(KEY,"off");showLesson();};document.getElementById("next").onclick=()=>{if(step>=LESSONS.length-1){lessonsOn=false;localStorage.setItem(KEY,"off");showLesson();return;}step++;showLesson();};addEventListener("resize",layout);best=Number(localStorage.getItem("shaft-best14")||0);document.getElementById("best").textContent=best;boot();requestAnimationFrame(drawFlow);
</script></body></html>
