<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Shaft</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#07090d; color:#f4efe6; font-family:"Avenir Next","Segoe UI",sans-serif; }
  body { background:radial-gradient(120% 70% at 50% -10%, #1a3140, #07090d 52%); }
  .app { width:min(430px,100vw); height:100dvh; margin:0 auto; display:flex; flex-direction:column; padding:8px 12px 10px; gap:6px; }
  .top { display:flex; justify-content:space-between; align-items:flex-end; }
  h1 { margin:0; letter-spacing:.18em; font-size:20px; } h1 i { font-style:normal; color:#3ee0ff; }
  .sub { color:#9a9286; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .kw b { display:block; font-size:28px; line-height:.9; }
  .kw span, .pill span { color:#9a9286; font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
  .pills { display:flex; gap:6px; }
  .pill { border:1px solid rgba(224,161,92,.28); border-radius:10px; padding:4px 7px; min-width:58px; }
  .pill b { display:block; font-size:14px; }
  .goal { color:#7dffa8; font-size:13px; }
  .hint { color:#3ee0ff; font-size:12px; }
  .coach { border:1px solid rgba(62,224,255,.55); border-radius:12px; padding:8px 10px; }
  .coach b { color:#3ee0ff; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .coach p { margin:3px 0 0; font-size:14px; }
  button { background:#121820; color:#f4efe6; border:1px solid rgba(154,146,134,.4); border-radius:10px; padding:8px 10px; font:inherit; }
  #next, #show, #town { background:#7dffa8; color:#04210f; border:0; font-weight:700; }
  .stage { flex:1; min-height:0; display:flex; align-items:center; }
  .frame { width:100%; border:1px solid rgba(154,146,134,.28); border-radius:18px; padding:6px; position:relative; }
  .frame.live { border-color:#7dffa8; box-shadow:0 0 18px rgba(62,224,255,.3); }
  .viewport { width:100%; aspect-ratio:1; overflow:hidden; border-radius:12px; position:relative; touch-action:none; background:#0c1218; }
  #world { position:absolute; left:0; top:0; display:grid; gap:2px; will-change:transform; }
  #flow { position:absolute; left:0; top:0; pointer-events:none; z-index:3; }
  .cell { border-radius:4px; background:#1a212b; position:relative; }
  .cell.yard { background:#10161e; box-shadow:inset 0 0 0 1px rgba(62,224,255,.12); }
  .cell.path { background:linear-gradient(180deg,#d39255,#6a3f22); }
  .cell.machine { background:radial-gradient(circle at 50% 42%,#b9ecff,#1b4a58 64%); }
  .cell.source { background:radial-gradient(circle at 50% 42%,#ffe3a6,#d36a14 58%,#2a2118 74%); }
  .cell.xfmr { background:radial-gradient(circle at 50% 50%,#d7c8ff,#2a3158 70%); }
  .cell.load { background:radial-gradient(circle at 50% 50%,#e9ffe8,#3dff88 42%,#146b32 78%); box-shadow:0 0 22px #7dffa8; z-index:2; }
  .cell.load::after { content:"TOWN"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#04210f; font-weight:800; }
  .pin { position:absolute; z-index:5; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; border:3px solid #b6ffcf; background:rgba(8,40,22,.82); color:#d8ffe8; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; pointer-events:none; box-shadow:0 0 18px #7dffa8; }
  .cell.town { background:#2f7a49; }
  .cell.town::after { content:"fed"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#04210f; }
  .cell.powered { box-shadow:inset 0 0 0 2px rgba(180,245,255,.9); animation:pulse 1.2s ease-in-out infinite; }
  .cell.fed { box-shadow:0 0 16px #7dffa8, inset 0 0 0 2px #7dffa8; }
  .cell.ghost { background:rgba(62,224,255,.62) !important; box-shadow:inset 0 0 0 3px #e8fbff, 0 0 14px #3ee0ff; z-index:4; }
  .cell.bad { background:rgba(255,93,74,.55) !important; box-shadow:inset 0 0 0 3px #ffd0c8; z-index:4; }
  @keyframes pulse { 50% { filter:brightness(1.35); } }
  .bang { position:absolute; inset:6px; display:flex; align-items:center; justify-content:center; background:rgba(3,16,14,.94); z-index:6; border-radius:12px; }
  .bang div { text-align:center; background:#071612; border:2px solid #7dffa8; border-radius:16px; padding:16px 18px; }
  .bang b { display:block; font-size:22px; color:#b6ffcf; } .bang span { font-size:15px; }
  .hidden { display:none !important; }
  .tray { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .slot { min-height:68px; border-radius:12px; border:1px solid rgba(154,146,134,.25); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; touch-action:none; }
  .slot em { font-style:normal; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#9a9286; }
  .piece { display:grid; gap:2px; } .pip { border-radius:3px; }
  .pip.source { background:#e0a15c; } .pip.path { background:#d39255; } .pip.machine { background:#7fd7ee; } .pip.xfmr { background:#c3b0ff; }
  .float { position:fixed; z-index:8; pointer-events:none; }
  .float .pip { position:fixed; border-radius:4px; box-shadow:0 0 0 2px #fff, 0 8px 16px rgba(0,0,0,.35); }
  .bar { display:flex; gap:8px; } .bar button { flex:1; }
</style></head>
<body><div class="app">
  <div class="top"><div><h1>SHA<i>F</i>T</h1><div class="sub">v16 · drop on the glow</div></div><div class="kw"><b id="kw">0</b><span>kilowatts</span></div></div>
  <div class="pills"><div class="pill"><b id="mod">1</b><span>module</span></div><div class="pill"><b id="view">8×8</b><span>view</span></div><div class="pill"><b id="best">0</b><span>best</span></div></div>
  <div class="coach" id="coach"><b id="step">step 1 of 4</b><p id="lesson"></p><div class="bar"><button id="next">next</button><button id="hide">hide</button></div></div>
  <div class="goal" id="goal">Module 1: power the green town.</div>
  <div class="hint">The bright cells are exactly where the piece will land.</div>
  <div class="stage"><div class="frame" id="frame"><div class="viewport" id="viewport"><div id="world"></div><div class="pin" id="pin">TOWN</div></div><div class="bang hidden" id="bang"><div><b id="bangTitle">MODULE 1 COMPLETE</b><span id="bangSub">Plant shrinking</span></div></div></div></div>
  <div class="tray" id="tray"></div><div class="bar"><button id="reset">reset</button><button id="town">town</button><button id="show" class="hidden">lessons</button></div>
</div><div class="float hidden" id="float"></div>
<script>
const N=24,BASE=8,VIEWS=[8,12,16,24],GAP=2,KEY="shaft-lessons-v16";
const NAMES={source:"core",path:"bus",machine:"turbine",xfmr:"transformer"};
const LESSONS=["Drag the gold core onto the pad. The bright cells are where it will land. Lift your finger to drop it there.","Run copper bus from the core toward the green town. Current only travels on connected pieces.","A turbine or transformer on that live path multiplies kilowatts. Off the path, it does nothing.","Touch the green TOWN with a powered piece. Then drag the pad to look around the whole yard."];
const CATALOG=[{kind:"source",shape:[[1,1],[1,1]]},{kind:"source",shape:[[1,1,1],[0,1,0]]},{kind:"path",shape:[[1,1,1,1]]},{kind:"path",shape:[[1],[1],[1],[1]]},{kind:"path",shape:[[1,1,1],[0,0,1]]},{kind:"path",shape:[[1,0],[1,0],[1,1]]},{kind:"path",shape:[[0,1],[0,1],[1,1]]},{kind:"path",shape:[[1,1,0],[0,1,1]]},{kind:"machine",shape:[[1,1],[1,1]]},{kind:"machine",shape:[[1,1,1],[0,1,0]]},{kind:"xfmr",shape:[[1,1,1]]}];
const worldEl=document.getElementById("world"),viewport=document.getElementById("viewport"),frameEl=document.getElementById("frame"),trayEl=document.getElementById("tray"),floatEl=document.getElementById("float"),coach=document.getElementById("coach"),bang=document.getElementById("bang"),flow=document.createElement("canvas");
flow.id="flow"; let grid,tray,drag,view,best,cells=[],load,busy,step,lessonsOn,cellPx=36,flowT=0,last=null,panX=0,panY=0,panning=null;
const empty=()=>Array.from({length:N},()=>Array(N).fill(null));
const windowOrigin=()=>Math.floor((N-VIEWS[view])/2);
const inView=(r,c)=>{const o=windowOrigin(),s=VIEWS[view];return r>=o&&c>=o&&r<o+s&&c<o+s;};
function placeLoad(){const o=windowOrigin(),s=VIEWS[view];let r=o+Math.max(2,s-4),c=o+Math.max(2,s-4);if(r>=N-1)r=N-2;if(c>=N-1)c=N-2;if(grid[r]&&grid[r][c]){r=o+2;c=o+Math.max(2,s-4);}load={r,c,size:2};}
function isLoadCell(r,c){const n=(load&&load.size)||1;return !!(load&&r>=load.r&&r<load.r+n&&c>=load.c&&c<load.c+n);}
function camScale(){return BASE/VIEWS[view];}
function clampPan(){const S=viewport.clientWidth||300;const span=(N*cellPx+GAP*(N-1))*camScale();if(span<=S+1){panX=(S-span)/2;panY=(S-span)/2;return;}panX=Math.min(8,Math.max(S-span-8,panX));panY=Math.min(8,Math.max(S-span-8,panY));}
function focusWorld(wx,wy,animate){const S=viewport.clientWidth||300;const scale=camScale();panX=S/2-wx*scale;panY=S/2-wy*scale;clampPan();layout(animate);}
function centerModule(animate){const o=windowOrigin(),v=VIEWS[view];const win=v*cellPx+GAP*(v-1);const mid=o*(cellPx+GAP)+win/2;focusWorld(mid,mid,animate);}
function centerTown(animate){if(!load)return;const step=cellPx+GAP,n=load.size||1;focusWorld(load.c*step+(n*cellPx+(n-1)*GAP)/2,load.r*step+(n*cellPx+(n-1)*GAP)/2,animate);}
function placePin(){const pin=document.getElementById("pin");if(!pin||!load)return;const scale=camScale(),step=cellPx+GAP,S=viewport.clientWidth||300;const x=panX+(load.c*step+cellPx/2)*scale,y=panY+(load.r*step+cellPx/2)*scale,pad=30;pin.style.left=Math.min(S-pad,Math.max(pad,x))+"px";pin.style.top=Math.min(S-pad,Math.max(pad,y))+"px";}
function stampTown(){if(!load)return;const n=load.size||1;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!grid[load.r+y][load.c+x])grid[load.r+y][load.c+x]={kind:"town"};}
function anchorOf(shape){const h=shape.length,w=shape[0].length;let bestA=[0,0],bd=1e9;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(shape[y][x]){const d=(y-(h-1)/2)**2+(x-(w-1)/2)**2;if(d<bd){bd=d;bestA=[y,x];}}return bestA;}
function pick(force){const pool=force?CATALOG.filter(p=>p.kind==="source"):CATALOG;const src=pool[Math.floor(Math.random()*pool.length)];return {kind:src.kind,shape:src.shape.map(r=>r.slice()),used:false};}
function freshTray(){const has=grid.flat().some(c=>c&&c.kind==="source");tray=has?[pick(false),pick(false),pick(false)]:[{kind:"source",shape:[[1,1],[1,1]],used:false},{kind:"path",shape:[[1,1,1,1]],used:false},{kind:"path",shape:[[1],[1],[1],[1]],used:false}];}
function fits(shape,r,c){for(let y=0;y<shape.length;y++)for(let x=0;x<shape[y].length;x++){if(!shape[y][x])continue;const nr=r+y,nc=c+x;if(nr<0||nc<0||nr>=N||nc>=N||grid[nr][nc]||!inView(nr,nc)||isLoadCell(nr,nc))return false;}return true;}
function analyze(){const powered=empty().map(row=>row.map(()=>false));const q=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]&&grid[r][c].kind==="source")q.push([r,c]);const seen=new Set(q.map(([r,c])=>r+","+c));let feed=false,n=0,machines=0;while(q.length){const [r,c]=q.shift();powered[r][c]=true;if(load){const sz=load.size||1;for(let y=0;y<sz;y++)for(let x=0;x<sz;x++)if(Math.abs(r-(load.r+y))+Math.abs(c-(load.c+x))===1)feed=true;}for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc,k=nr+","+nc;if(nr<0||nc<0||nr>=N||nc>=N||seen.has(k)||!grid[nr][nc])continue;seen.add(k);q.push([nr,nc]);}}for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!powered[r][c])continue;n++;if(grid[r][c].kind==="machine"||grid[r][c].kind==="xfmr")machines++;}return {powered,feed,kw:n*25+machines*110+(feed?150+view*200:0)};}
function layout(animate){const S=viewport.clientWidth||300;cellPx=(S-GAP*(BASE-1))/BASE;const worldPx=N*cellPx+GAP*(N-1);worldEl.style.width=worldPx+"px";worldEl.style.height=worldPx+"px";worldEl.style.gridTemplateColumns=`repeat(${N}, ${cellPx}px)`;worldEl.style.gridTemplateRows=`repeat(${N}, ${cellPx}px)`;worldEl.style.transition=animate?"transform 1.05s cubic-bezier(.2,.7,.2,1)":"none";worldEl.style.transformOrigin="0 0";worldEl.style.transform=`translate(${panX}px, ${panY}px) scale(${camScale()})`;flow.width=Math.round(worldPx);flow.height=Math.round(worldPx);flow.style.width=worldPx+"px";flow.style.height=worldPx+"px";placePin();}
function paint(){const a=analyze();last=a;cells.forEach((el,i)=>{const r=Math.floor(i/N),c=i%N,cell=grid[r][c],isLoad=isLoadCell(r,c);el.className="cell"+(inView(r,c)?"":" yard")+(isLoad?" load":"")+(cell?" "+cell.kind:"")+(cell&&a.powered[r][c]?" powered":"")+(isLoad&&a.feed?" fed":"");});document.getElementById("kw").textContent=a.kw;document.getElementById("mod").textContent=Math.min(view+1,VIEWS.length);document.getElementById("view").textContent=VIEWS[view]+"\u00d7"+VIEWS[view];document.getElementById("best").textContent=best;frameEl.classList.toggle("live",!!a.feed);document.getElementById("goal").textContent=view>=VIEWS.length-1&&a.feed?"Plant complete. Drag the pad to look around.":"Module "+(view+1)+": power the green TOWN. Drop on the bright cells.";if(a.kw>best){best=a.kw;localStorage.setItem("shaft-best16",String(best));document.getElementById("best").textContent=best;}return a;}
function pieceHTML(p,size){const h=p.shape.length,w=p.shape[0].length;return `<div class="piece" style="grid-template-columns:repeat(${w},${size}px);grid-template-rows:repeat(${h},${size}px)">${p.shape.flat().map(v=>v?`<div class="pip ${p.kind}"></div>`:"<div></div>").join("")}</div>`;}
function renderTray(){trayEl.innerHTML=tray.map((p,i)=>`<div class="slot" data-i="${i}">${p&&!p.used?pieceHTML(p,14)+`<em>${NAMES[p.kind]}</em>`:""}</div>`).join("");bindTray();}
function showLesson(){if(!lessonsOn){coach.classList.add("hidden");document.getElementById("show").classList.remove("hidden");return;}coach.classList.remove("hidden");document.getElementById("show").classList.add("hidden");document.getElementById("step").textContent="step "+(Math.min(step,LESSONS.length-1)+1)+" of "+LESSONS.length;document.getElementById("lesson").textContent=LESSONS[Math.min(step,LESSONS.length-1)];document.getElementById("next").textContent=step>=LESSONS.length-1?"done":"next";}
function celebrate(){busy=true;document.getElementById("bangTitle").textContent="MODULE "+(view+1)+" COMPLETE";document.getElementById("bangSub").textContent=view>=VIEWS.length-1?"The yard is open":"Plant shrinking";bang.classList.remove("hidden");setTimeout(()=>{stampTown();if(view<VIEWS.length-1)view++;placeLoad();centerTown(true);paint();setTimeout(()=>{bang.classList.add("hidden");busy=false;},1600);},700);}
function place(p,r,c){const before=analyze().feed;for(let y=0;y<p.shape.length;y++)for(let x=0;x<p.shape[y].length;x++)if(p.shape[y][x])grid[r+y][c+x]={kind:p.kind};p.used=true;if(tray.every(t=>t.used))freshTray();const a=paint();renderTray();if(!before&&a.feed)celebrate();else if(step===0&&p.kind==="source"){step=1;showLesson();}else if(step===1&&p.kind==="path"){step=2;showLesson();}}
function cellAt(x,y){return cells.find(el=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;});}
function targetOf(x,y,p){const hit=cellAt(x,y);if(!hit)return null;const i=Number(hit.dataset.i),[ay,ax]=anchorOf(p.shape);return {r:Math.floor(i/N)-ay,c:(i%N)-ax};}
function hover(x,y,p){cells.forEach(el=>el.classList.remove("ghost","bad"));const spot=targetOf(x,y,p);if(!spot)return null;const ok=fits(p.shape,spot.r,spot.c);for(let yy=0;yy<p.shape.length;yy++)for(let xx=0;xx<p.shape[yy].length;xx++){if(!p.shape[yy][xx])continue;const nr=spot.r+yy,nc=spot.c+xx;if(nr<0||nc<0||nr>=N||nc>=N)continue;cells[nr*N+nc].classList.add(ok?"ghost":"bad");}return ok?spot:null;}
function paintFloat(p,x,y){const spot=targetOf(x,y,p);floatEl.innerHTML="";floatEl.classList.remove("hidden");floatEl.style.left="0px";floatEl.style.top="0px";const [ay,ax]=anchorOf(p.shape);if(spot){for(let yy=0;yy<p.shape.length;yy++)for(let xx=0;xx<p.shape[yy].length;xx++){if(!p.shape[yy][xx])continue;const nr=spot.r+yy,nc=spot.c+xx;if(nr<0||nc<0||nr>=N||nc>=N)continue;const b=cells[nr*N+nc].getBoundingClientRect();const pip=document.createElement("div");pip.className="pip "+p.kind;pip.style.left=b.left+"px";pip.style.top=b.top+"px";pip.style.width=b.width+"px";pip.style.height=b.height+"px";floatEl.appendChild(pip);}return;}const sample=cells[0].getBoundingClientRect();const size=sample.width||cellPx,gap=2;for(let yy=0;yy<p.shape.length;yy++)for(let xx=0;xx<p.shape[yy].length;xx++){if(!p.shape[yy][xx])continue;const pip=document.createElement("div");pip.className="pip "+p.kind;pip.style.left=(x+(xx-ax)*(size+gap)-size/2)+"px";pip.style.top=(y+(yy-ay)*(size+gap)-size/2)+"px";pip.style.width=size+"px";pip.style.height=size+"px";floatEl.appendChild(pip);}}
function bindTray(){trayEl.querySelectorAll(".slot").forEach(slot=>{slot.onpointerdown=e=>{const p=tray[Number(slot.dataset.i)];if(!p||p.used||busy)return;e.preventDefault();slot.setPointerCapture(e.pointerId);drag={p,pid:e.pointerId};paintFloat(p,e.clientX,e.clientY);hover(e.clientX,e.clientY,p);};slot.onpointermove=e=>{if(!drag||drag.pid!==e.pointerId)return;paintFloat(drag.p,e.clientX,e.clientY);hover(e.clientX,e.clientY,drag.p);};slot.onpointerup=e=>{if(!drag||drag.pid!==e.pointerId)return;const spot=hover(e.clientX,e.clientY,drag.p);floatEl.classList.add("hidden");floatEl.innerHTML="";cells.forEach(el=>el.classList.remove("ghost","bad"));const p=drag.p;drag=null;if(spot)place(p,spot.r,spot.c);};slot.onpointercancel=()=>{drag=null;floatEl.classList.add("hidden");floatEl.innerHTML="";cells.forEach(el=>el.classList.remove("ghost","bad"));};});}
function drawFlow(){const ctx=flow.getContext("2d"),w=flow.width;ctx.clearRect(0,0,w,w);if(last){ctx.lineWidth=Math.max(2,cellPx*0.16);ctx.strokeStyle="rgba(62,224,255,.9)";ctx.shadowColor="#3ee0ff";ctx.shadowBlur=8;ctx.setLineDash([cellPx*0.28,cellPx*0.34]);ctx.lineDashOffset=-flowT;ctx.lineCap="round";ctx.beginPath();const step=cellPx+GAP;for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!last.powered[r][c])continue;const x=c*step+cellPx/2,y=r*step+cellPx/2;if(c+1<N&&last.powered[r][c+1]){ctx.moveTo(x,y);ctx.lineTo(x+step,y);}if(r+1<N&&last.powered[r+1][c]){ctx.moveTo(x,y);ctx.lineTo(x,y+step);}}ctx.stroke();}flowT=(flowT+0.85)%(cellPx*2);requestAnimationFrame(drawFlow);}
function boot(){grid=empty();view=0;busy=false;step=0;panX=0;panY=0;lessonsOn=localStorage.getItem(KEY)!=="off";placeLoad();worldEl.innerHTML="";worldEl.appendChild(flow);grid.flat().forEach((_,i)=>{const el=document.createElement("div");el.className="cell";el.dataset.i=i;worldEl.appendChild(el);});cells=[...worldEl.querySelectorAll(".cell")];freshTray();bang.classList.add("hidden");showLesson();centerModule(false);paint();renderTray();}
function bindPan(){viewport.onpointerdown=e=>{if(drag||busy)return;panning={id:e.pointerId,x:e.clientX,y:e.clientY,px:panX,py:panY};viewport.setPointerCapture(e.pointerId);worldEl.style.transition="none";};viewport.onpointermove=e=>{if(!panning||panning.id!==e.pointerId||drag)return;panX=panning.px+(e.clientX-panning.x);panY=panning.py+(e.clientY-panning.y);clampPan();layout(false);};viewport.onpointerup=e=>{if(panning&&panning.id===e.pointerId)panning=null;};viewport.onpointercancel=()=>{panning=null;};}
document.getElementById("reset").onclick=boot;document.getElementById("town").onclick=()=>centerTown(true);document.getElementById("show").onclick=()=>{lessonsOn=true;localStorage.removeItem(KEY);showLesson();};document.getElementById("hide").onclick=()=>{lessonsOn=false;localStorage.setItem(KEY,"off");showLesson();};document.getElementById("next").onclick=()=>{if(step>=LESSONS.length-1){lessonsOn=false;localStorage.setItem(KEY,"off");showLesson();return;}step++;showLesson();};addEventListener("resize",()=>centerModule(false));bindPan();best=Number(localStorage.getItem("shaft-best16")||0);document.getElementById("best").textContent=best;boot();requestAnimationFrame(drawFlow);
</script></body></html>
